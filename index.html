<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portais · Amanda Guerra Nutrição</title>
<meta name="theme-color" content="#3f5544">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233f5544'/%3E%3Cpath d='M32 48c0-14 6-22 16-24-2 12-8 20-16 24z' fill='%23c9d8bf'/%3E%3Cpath d='M32 48C24 44 18 36 16 24c10 2 16 10 16 24z' fill='%23e8efe2'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#222b24;--ink-soft:#5b6a5f;--ink-faint:#8a978d;
    --bg:#f7f5f0;--card:#fff;--line:#e4e2da;
    --brand:#3f5544;--brand-2:#5d7a62;--sage:#c9d8bf;--sage-soft:#eef3ea;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6}
  header{
    background:linear-gradient(150deg,#43594a,#2b3a30);color:#fff;
    padding:36px 20px 30px;text-align:center;
  }
  header .mark{
    width:46px;height:46px;margin:0 auto 12px;border-radius:12px;background:var(--sage);
    display:flex;align-items:center;justify-content:center;
  }
  header h1{font-family:var(--serif);font-size:24px;font-weight:600;margin:0 0 5px}
  header p{margin:0;font-size:13px;color:#bdcdc1;letter-spacing:.03em}
  main{max-width:640px;margin:0 auto;padding:24px 16px 60px}
  .search{
    width:100%;padding:12px 15px;font-size:15px;font-family:var(--sans);
    border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);
    margin-bottom:8px;
  }
  .search:focus{outline:none;border-color:var(--brand-2)}
  .count{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.09em;margin:14px 2px 9px}
  a.p{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 16px;margin-bottom:9px;transition:.18s;
  }
  a.p:hover{border-color:var(--sage);box-shadow:0 3px 12px rgba(34,43,36,.07);transform:translateY(-1px)}
  .ini{
    flex:0 0 44px;height:44px;border-radius:50%;background:var(--sage-soft);
    color:var(--brand);font-family:var(--serif);font-size:17px;font-weight:600;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--sage);
  }
  .p .info{flex:1;min-width:0}
  .p b{display:block;font-size:16px;font-weight:600;font-family:var(--serif)}
  .p .goal{font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p .date{font-size:11px;color:var(--ink-faint);flex:0 0 auto;text-align:right}
  .arrow{color:var(--ink-faint);font-size:18px;flex:0 0 auto}
  .empty{text-align:center;color:var(--ink-faint);font-size:14px;padding:26px 0;display:none}
  footer{text-align:center;font-size:12px;color:var(--ink-faint);padding:22px 16px 40px;border-top:1px solid var(--line)}
  footer b{font-family:var(--serif);color:var(--brand);display:block;font-size:14px;margin-bottom:4px;font-weight:600}
</style>
</head>
<body>

<header>
  <div class="mark">
    <svg width="24" height="24" viewBox="0 0 64 64"><path d="M32 52c0-16 7-25 18-27-2 14-9 23-18 27z" fill="#3f5544"/><path d="M32 52c-9-4-16-13-18-27 11 2 18 11 18 27z" fill="#5d7a62"/></svg>
  </div>
  <h1>Portais dos Pacientes</h1>
  <p>Amanda Guerra · Nutrição</p>
</header>

<main>
  <input class="search" id="q" type="search" placeholder="Buscar paciente…" autocomplete="off">
  <div class="count" id="count"></div>

  <div id="list">
    <!-- ADICIONAR NOVO PACIENTE: copiar um bloco <a class="p"> e trocar os dados -->
    <a class="p" href="paciente-teste.html" data-nome="Maria Teste">
      <span class="ini">MT</span>
      <span class="info">
        <b>Maria Teste</b>
        <span class="goal">Emagrecimento e saúde metabólica</span>
      </span>
      <span class="date">22/07/26</span>
      <span class="arrow">→</span>
    </a>
  </div>

  <div class="empty" id="empty">Nenhum paciente encontrado.</div>
</main>

<footer>
  <b>Amanda Guerra · Nutricionista</b>
  CRN 00000 · Conteúdo confidencial
</footer>

<script>
(function(){
  var q = document.getElementById("q"),
      items = [].slice.call(document.querySelectorAll("a.p")),
      count = document.getElementById("count"),
      empty = document.getElementById("empty");
  function render(){
    var t = q.value.trim().toLowerCase(), n = 0;
    items.forEach(function(el){
      var hit = !t || (el.dataset.nome + " " + el.textContent).toLowerCase().indexOf(t) > -1;
      el.style.display = hit ? "flex" : "none";
      if(hit) n++;
    });
    count.textContent = n + (n === 1 ? " paciente" : " pacientes");
    empty.style.display = n ? "none" : "block";
  }
  q.addEventListener("input", render); render();
})();
</script>
</body>
</html>
