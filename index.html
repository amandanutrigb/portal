<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portais · Amanda Guerra Nutrição</title>
<meta name="theme-color" content="#f0c9ce">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f0c9ce'/%3E%3Cpath d='M32 47c0-13 6-20 15-22-2 11-7 18-15 22z' fill='%23a86b78'/%3E%3Cpath d='M32 47c-8-4-13-11-15-22 9 2 15 9 15 22z' fill='%23c68d97'/%3E%3C/svg%3E">
<style>
  :root{
    --rose:#f0c9ce;--rose-2:#e5aeb6;--rose-soft:#fbeef0;--rose-line:#efd7db;
    --rose-deep:#a86b78;--plum:#5b3b42;
    --bg:#faf6ef;--card:#fffdfa;--line:#ece0d1;--beige:#f7f0e6;
    --ink:#4d3b3e;--ink-soft:#7c686b;--ink-faint:#a89490;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6}
  header{
    background:linear-gradient(150deg,#f6d8dc,var(--rose) 55%,#e7b3ba);
    color:var(--plum);padding:34px 20px 28px;text-align:center;
  }
  header img{max-height:52px;margin:0 auto 12px;display:block}
  header .mark{
    width:44px;height:44px;margin:0 auto 11px;border-radius:12px;
    background:rgba(255,255,255,.68);display:flex;align-items:center;justify-content:center;
  }
  header h1{font-family:var(--serif);font-size:24px;font-weight:600;margin:0 0 4px}
  header p{margin:0;font-size:12.5px;color:#7d5259;letter-spacing:.04em}
  main{max-width:640px;margin:0 auto;padding:22px 16px 60px}
  .search{
    width:100%;padding:12px 15px;font-size:15px;font-family:var(--sans);
    border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);
  }
  .search:focus{outline:none;border-color:var(--rose-2)}
  .count{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.09em;margin:15px 2px 9px}
  a.p{
    display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 15px;margin-bottom:9px;transition:.18s;
  }
  a.p:hover{border-color:var(--rose-line);box-shadow:0 3px 12px rgba(91,59,66,.07);transform:translateY(-1px)}
  .ini{
    flex:0 0 42px;height:42px;border-radius:50%;background:var(--rose-soft);
    color:var(--rose-deep);font-family:var(--serif);font-size:16px;font-weight:600;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--rose-line);
  }
  .p .info{flex:1;min-width:0}
  .p b{display:block;font-size:16px;font-weight:600;font-family:var(--serif)}
  .p .goal{font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p .date{font-size:11px;color:var(--ink-faint);flex:0 0 auto;text-align:right}
  .arrow{color:var(--rose-2);font-size:17px;flex:0 0 auto}
  .empty{text-align:center;color:var(--ink-faint);font-size:14px;padding:24px 0;display:none}
  footer{text-align:center;font-size:12px;color:var(--ink-faint);padding:20px 16px 40px;border-top:1px solid var(--line)}
  footer b{font-family:var(--serif);color:var(--rose-deep);display:block;font-size:14px;margin-bottom:3px;font-weight:600}
</style>
</head>
<body>

<header>
  <img src="logo.png" alt="" onerror="this.outerHTML='<div class=\'mark\'><svg width=\'22\' height=\'22\' viewBox=\'0 0 64 64\'><path d=\'M32 50c0-15 7-23 17-25-2 13-8 21-17 25z\' fill=\'#a86b78\'/><path d=\'M32 50c-9-4-15-12-17-25 10 2 17 10 17 25z\' fill=\'#c68d97\'/></svg></div>'">
  <h1>Portais dos Pacientes</h1>
  <p>Amanda Guerra · Nutrição</p>
</header>

<main>
  <input class="search" id="q" type="search" placeholder="Buscar paciente…" autocomplete="off">
  <div class="count" id="count"></div>

  <div id="list">
    <!-- NOVO PACIENTE: copiar um bloco e trocar nome, objetivo, data e href -->
    <a class="p" href="p-58204719.html">
      <span class="ini">MT</span>
      <span class="info">
        <b>Maria Teste</b>
        <span class="goal">Emagrecimento e saúde metabólica</span>
      </span>
      <span class="date">29/07/26</span>
      <span class="arrow">→</span>
    </a>
  </div>

  <div class="empty" id="empty">Nenhum paciente encontrado.</div>
</main>

<footer>
  <b>Amanda Guerra · Nutricionista</b>
  CRN 00000 · Conteúdo confidencial
</footer>

<script>
(function(){
  var q = document.getElementById("q"),
      items = [].slice.call(document.querySelectorAll("a.p")),
      count = document.getElementById("count"),
      empty = document.getElementById("empty");
  function render(){
    var t = q.value.trim().toLowerCase(), n = 0;
    items.forEach(function(el){
      var hit = !t || el.textContent.toLowerCase().indexOf(t) > -1;
      el.style.display = hit ? "flex" : "none";
      if (hit) n++;
    });
    count.textContent = n + (n === 1 ? " paciente" : " pacientes");
    empty.style.display = n ? "none" : "block";
  }
  q.addEventListener("input", render); render();
})();
</script>
</body>
</html>
